<style>

  --c-fio2: #0e7c86; --c-peep: #6250d6;
  --p-ne: #2a78d6; --p-vaso: #6250d6; --p-epi: #e34948; --p-phe: #1baf7a; --p-dopa: #eda100; --p-ang: #e87ba4; --p-total: #1c2733;
  --c-pos: #c92a2a; --c-neg: #7b8794;
  --a-bact: #0f766e; --a-fung: #7c5cbf; --a-viral: #b45f06;
  --bal-bact: #c2410c; --bal-viral: #5b4bc4; --bal-fung: #a16207; --bal-col: #8a7a5c; --bal-neg: #7b8794;
  --dn: #d9622b; --dm: #3d6fb6; --dl: #2a9d8f; --de: #d9a21b; --do: #a3adb9;
  --sus-s: #1a7f4b; --sus-i: #a15c00; --sus-r: #c92a2a;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1620; --panel: #151f2b; --ink: #e6ebf2; --ink2: #aab6c4; --ink3: #8794a3;
    --line: #2a3646; --grid: #212c3a; --grid2: #34425a; --accent: #6ea3e6; --accent-soft: #1b2a3f;
    --alert: #f07575; --alert-soft: #2c1a1c; --alert-line: #5a2c2f; --shadow: 0 6px 20px rgba(0,0,0,.5);
    --on-bar: #0b1420; --icu-tint: rgba(110,163,230,.09); --cursor: #8fa0b4; --badge-bg: #e6ebf2; --badge-fg: #0e1620;
    --c-icu: #5b95dd; --c-stepdown: #3f6494; --c-ward: #2c3a4d; --c-ed: #6b5636; --c-otherloc: #2a3340;
    --d-imv: #3987e5; --d-nippv: #9085e9; --d-cpap: #d55181; --d-hf: #199e70; --d-fm: #c98500; --d-nc: #d95926; --d-other: #8794a3; --on-amber: #0b1420;
    --c-fio2: #3bb7c2; --c-peep: #9a8df0;
    --p-ne: #3987e5; --p-vaso: #9085e9; --p-epi: #e66767; --p-phe: #199e70; --p-dopa: #c98500; --p-ang: #d55181; --p-total: #e6ebf2;
    --c-pos: #f07575; --c-neg: #8794a3;
    --a-bact: #3fb6aa; --a-fung: #a78be0; --a-viral: #e0903a;
    --bal-bact: #f08a5d; --bal-viral: #a193f2; --bal-fung: #e0b04a; --bal-col: #b3a37f; --bal-neg: #8794a3;
    --dn: #ee8654; --dm: #6e9be0; --dl: #4cc2b3; --de: #e8bb4a; --do: #6f7d8c;
    --sus-s: #4cc38a; --sus-i: #e8b04a; --sus-r: #f07575;
    --c-temp: #f08a52; --c-hot: #f07575; --c-cold: #6ea3e6; --band-hot: rgba(240,117,117,.12); --band-cold: rgba(110,163,230,.12);
    --c-wbc: #e57bb0; --c-lab: #9a93ee;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1620; --panel: #151f2b; --ink: #e6ebf2; --ink2: #aab6c4; --ink3: #8794a3;
  --line: #2a3646; --grid: #212c3a; --grid2: #34425a; --accent: #6ea3e6; --accent-soft: #1b2a3f;
  --alert: #f07575; --alert-soft: #2c1a1c; --alert-line: #5a2c2f; --shadow: 0 6px 20px rgba(0,0,0,.5);
  --on-bar: #0b1420; --icu-tint: rgba(110,163,230,.09); --cursor: #8fa0b4; --badge-bg: #e6ebf2; --badge-fg: #0e1620;
  --c-icu: #5b95dd; --c-stepdown: #3f6494; --c-ward: #2c3a4d; --c-ed: #6b5636; --c-otherloc: #2a3340;
  --d-imv: #3987e5; --d-nippv: #9085e9; --d-cpap: #d55181; --d-hf: #199e70; --d-fm: #c98500; --d-nc: #d95926; --d-other: #8794a3; --on-amber: #0b1420;
  --c-fio2: #3bb7c2; --c-peep: #9a8df0;
  --p-ne: #3987e5; --p-vaso: #9085e9; --p-epi: #e66767; --p-phe: #199e70; --p-dopa: #c98500; --p-ang: #d55181; --p-total: #e6ebf2;
  --c-pos: #f07575; --c-neg: #8794a3;
  --a-bact: #3fb6aa; --a-fung: #a78be0; --a-viral: #e0903a;
  --bal-bact: #f08a5d; --bal-viral: #a193f2; --bal-fung: #e0b04a; --bal-col: #b3a37f; --bal-neg: #8794a3;
  --dn: #ee8654; --dm: #6e9be0; --dl: #4cc2b3; --de: #e8bb4a; --do: #6f7d8c;
  --sus-s: #4cc38a; --sus-i: #e8b04a; --sus-r: #f07575;
  --c-temp: #f08a52; --c-hot: #f07575; --c-cold: #6ea3e6; --band-hot: rgba(240,117,117,.12); --band-cold: rgba(110,163,230,.12);
  --c-wbc: #e57bb0; --c-lab: #9a93ee;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.top { flex: none; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.mark { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(90deg, var(--c-icu) 0 55%, var(--c-stepdown) 55% 100%); }
.top-r { display: flex; align-items: center; gap: 12px; min-width: 0; }
.src { color: var(--ink3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.theme { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; color: var(--ink2); }
.theme:hover { background: var(--accent-soft); color: var(--accent); }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.side-head { padding: 14px 16px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.count { color: var(--ink3); font-size: 12px; }
.count b { color: var(--ink); font-weight: 600; }
.filters { padding: 6px 16px 12px; border-bottom: 1px solid var(--grid); display: grid; gap: 10px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.search:focus { background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12px; color: var(--ink2); }
.chip:hover { border-color: var(--grid2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-bar); }
.selects { display: grid; grid-template-columns: 1.4fr 1fr 1.1fr; gap: 8px; }
.selects label, .lab-pick { display: grid; gap: 3px; font-size: 11.5px; color: var(--ink3); min-width: 0; }
select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; min-width: 0; }
#selOrg { text-transform: capitalize; }
.link { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.plist { list-style: none; margin: 0; padding: 4px 0 12px; overflow-y: auto; flex: 1; min-height: 0; }
.plist .none { padding: 18px 16px; color: var(--ink3); }
.prow { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 8px 16px 8px 13px; display: grid; gap: 1px; }
.prow:hover { background: var(--bg); }
.prow[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.prow-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pid { font-weight: 600; }
.prow-sub { color: var(--ink3); font-size: 12px; }
.tags { display: flex; gap: 4px; }
.tag { font-style: normal; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--grid); color: var(--ink2); }
.t-imv { background: var(--accent-soft); color: var(--accent); }
.t-pressor { background: var(--grid); color: var(--c-lab); }
.t-cx { background: var(--alert-soft); color: var(--alert); }

.main { overflow: auto; padding: 18px 24px 28px; min-width: 0; }
.phead { display: grid; gap: 14px; margin-bottom: 14px; }
.phead h1 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
.phead-id p { margin: 2px 0 0; color: var(--ink2); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 1px; min-width: 0; }
.stat-v { font-size: 19px; font-weight: 600; }
.stat-l { color: var(--ink2); font-size: 12px; }
.stat-s { color: var(--ink3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.alert { border-color: var(--alert-line); background: var(--alert-soft); }
.stat.alert .stat-v { color: var(--alert); }

.toolbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; border-right: 1px solid var(--grid); }
.seg button:last-child { border-right: 0; }
.seg button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.seg button:disabled { color: var(--ink3); opacity: .5; cursor: default; }
.spacer { flex: 1; }
.hint { color: var(--ink3); font-size: 12px; align-self: center; }

.chart-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: clip; }
.plot { position: relative; width: 100%; touch-action: pan-y; }
.ruler { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); height: 64px; }
#ovw { cursor: pointer; touch-action: none; }
.ruler svg, .lanes svg { display: block; }
.xbadge { position: absolute; top: 33px; padding: 2px 7px; border-radius: 4px; font-size: 11px; white-space: nowrap; background: var(--badge-bg); color: var(--badge-fg); pointer-events: none; display: none; transform: translateX(-50%); }
.xline { position: absolute; top: 64px; bottom: 0; width: 1px; background: var(--cursor); pointer-events: none; display: none; z-index: 2; }
.lanes { cursor: grab; user-select: none; -webkit-user-select: none; }
.lanes.drag { cursor: grabbing; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px; max-width: 320px; display: none; }
.tip .tt { font-weight: 600; margin-bottom: 4px; padding-left: 6px; border-left: 3px solid var(--grid2); }
.tip .tr { display: flex; gap: 12px; justify-content: space-between; min-width: 200px; line-height: 1.5; }
.tip .tr span:first-child { color: var(--ink3); }
.tip .tr span:last-child { text-align: right; }
.t-bal { background: color-mix(in srgb, var(--bal-viral) 14%, transparent); color: var(--bal-viral); }
.bal-card { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 4px; }
.bal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bal-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
.bal-head .sub { color: var(--ink3); font-size: 12.5px; }
.syn { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--grid2); color: var(--ink2); }
.bal { border-top: 1px solid var(--grid); margin-top: 12px; padding: 14px 0 16px; scroll-margin-top: 14px; border-radius: 4px; }
.bal:first-of-type { margin-top: 10px; }
.bal.flash, .susc-card.flash { animation: balflash 1.6s ease-out; }
@keyframes balflash { 0% { background: color-mix(in srgb, var(--accent) 16%, transparent); } 100% { background: transparent; } }
.bal-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.bal-title { font-weight: 600; font-size: 14px; }
.bal-when { color: var(--ink2); font-size: 12.5px; }
.bal-top .spacer { flex: 1; }
.bal-meta { color: var(--ink3); font-size: 12px; margin-top: 2px; }
.cat { font-size: 11px; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.cat.bacterial { color: var(--bal-bact); } .cat.viral { color: var(--bal-viral); } .cat.fungal { color: var(--bal-fung); } .cat.colonization { color: var(--bal-col); border-style: dashed; } .cat.none { color: var(--ink3); }
.linkbtn { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.linkbtn:hover { border-color: var(--accent); }
.bal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 16px 24px; margin-top: 12px; }
.bal-sec h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); font-weight: 600; }
.bal-sec .big { font-size: 20px; font-weight: 600; line-height: 1.2; }
.bal-sec .big small { font-size: 11.5px; color: var(--ink3); font-weight: 400; margin-left: 3px; }
.bal-sec .row { font-size: 12.5px; line-height: 1.55; color: var(--ink2); }
.bal-sec .row b { color: var(--ink); font-weight: 600; }
.bal-sec .none { color: var(--ink3); font-size: 12.5px; font-style: italic; }
.dbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--grid); margin: 9px 0 6px; }
.dbar i { display: block; height: 100%; }
.dleg { display: flex; flex-wrap: wrap; gap: 2px 11px; font-size: 11.5px; color: var(--ink2); }
.dleg span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--k); margin-right: 4px; vertical-align: -0.5px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; margin: 0 5px 5px 0; border: 1px solid var(--line); color: var(--ink2); }
.pill.hit { font-weight: 600; border-color: transparent; background: color-mix(in srgb, var(--k, var(--alert)) 13%, transparent); color: var(--k, var(--alert)); }
.pill small { font-weight: 400; opacity: .85; margin-left: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bal-bact); }
.dot.minor { background: transparent; border: 1.5px solid var(--bal-neg); }
.nt { white-space: nowrap; color: var(--ink3); font-style: italic; font-size: 12px; margin-left: 2px; }
.susc-card { margin-top: 14px; }
.susc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px 24px; margin: 10px 0 14px; }
.susc-org h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.susc-sum { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.susc-sum b { font-weight: 600; }
.susc-res { font-size: 12px; color: var(--sus-r); margin-bottom: 6px; }
.stbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.stbl th { text-align: left; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); font-weight: 600; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid2); }
.stbl td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); color: var(--ink); }
.stbl td.mic { color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sc { display: inline-block; min-width: 54px; white-space: nowrap; text-align: center; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--k) 14%, transparent); color: var(--k); }
.sc.S { --k: var(--sus-s); } .sc.IND { --k: var(--sus-i); } .sc.NS { --k: var(--sus-r); } .sc.NA { --k: var(--ink3); }
.ccat { font-size: 10.5px; color: var(--ink3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.orgbtn { font: inherit; font-size: 12.5px; text-align: left; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.orgbtn:hover b { text-decoration: underline; }
.orgbtn .go { color: var(--accent); font-size: 11.5px; margin-left: 4px; }
.bal-note { color: var(--ink3); font-size: 12px; margin-top: 10px; }
.credit { margin: 14px 2px 0; color: var(--ink3); font-size: 11px; }
.foot { margin: 12px 2px 0; color: var(--ink3); font-size: 12px; max-width: 110ch; }
.state { max-width: 520px; margin: 12vh auto; padding: 0 24px; color: var(--ink2); }
svg text { font-family: var(--font); }

@media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 100%; }
  .body { display: block; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); max-height: 420px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main { overflow: visible; padding: 14px 16px 24px; }
  .src { display: none; }
  .selects { grid-template-columns: 1fr 1fr; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>ICU infection timeline</div>
    <div class="top-r">
      <span class="src" id="src"></span>
      <button type="button" class="theme" id="themeBtn" aria-label="Switch colour theme">Dark</button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar" aria-label="Cohort">
      <div class="side-head"><h2>Cohort</h2><span class="count" id="count"></span></div>
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Search hospitalization or patient ID" aria-label="Search by ID">
        <div class="chips" id="chips" role="group" aria-label="Filters"></div>
        <div class="selects">
          <label>Organism <select id="selOrg"></select></label>
          <label>ICU time <select id="selIcu">
            <option value="0">Any</option><option value="24">≥ 24 h</option><option value="48">≥ 48 h</option><option value="96">≥ 4 days</option><option value="168">≥ 7 days</option>
          </select></label>
          <label>Sort by <select id="selSort">
            <option value="icu_hours">ICU time</option><option value="los_days">Hospital stay</option><option value="n_cultures">Cultures</option><option value="age">Age</option>
          </select></label>
        </div>
        <button type="button" class="link" id="clear" hidden></button>
      </div>
      <ul class="plist" id="plist"></ul>
    </aside>
    <main class="main" id="main">
      <section class="phead" id="phead"></section>
      <div class="toolbar">

  var rt = 0; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawChart, 80); });
  if (window.ResizeObserver) new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(drawChart, 60); }).observe($('card'));

  function isDark() { var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function themeLabel() { $('themeBtn').textContent = isDark() ? 'Light' : 'Dark'; }
  $('themeBtn').onclick = function () { document.documentElement.setAttribute('data-theme', isDark() ? 'light' : 'dark'); themeLabel(); };
  themeLabel();
}

/* ---------- boot ---------- */
$('src').textContent = META.n + ' ICU hospitalizations · ' + META.source_label + ' · times in ' + TZ;
$('foot').textContent = 'Shaded columns are ICU stays. Temperature and WBC bands use SIRS thresholds (temp > ' + SIRS.temp_high_c + ' or < ' + SIRS.temp_low_c + ' °C; WBC > ' + SIRS.wbc_high + ' or < ' + SIRS.wbc_low +
  ' ×10³/µL). Vasopressor total is norepinephrine-equivalent: norepinephrine + epinephrine + phenylephrine ÷ 10 + dopamine ÷ 100 + vasopressin (units/min) × 2.5. ' + (META.temp_values_dropped ? META.temp_values_dropped + ' implausible temperature values were excluded. ' : '') +
  (META.bal_synthetic ? 'BAL results are SYNTHETIC examples (the public demo has none), generated to follow the BAL schema. ' : '') + 'Public de-identified demo data with shifted dates.';
buildFilterUi(); wire();
// open on a patient that shows every lane: ventilated, on pressors, positive culture, several antimicrobials
var best = ROWS.slice().sort(function (a, b) {
  function sc(r) { return (r.positive_culture ? 3 : 0) + (r.blood_culture_positive ? 1 : 0) + (r.pressor ? 3 : 0) + (r.imv ? 3 : 0) + Math.min(r.n_antibiotics, 4) + (r.fever ? 1 : 0) + (r.n_icu_stays > 1 ? 5 : 0) - Math.abs((r.icu_hours || 0) - 150) / 60; }
  return sc(b) - sc(a);
})[0];
select(best.id);
})();
</script>
